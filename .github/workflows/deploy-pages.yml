name: Atualizar dados e publicar GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 07h17 a 20h17 em America/Sao_Paulo (UTC−3). Fora dessa janela, a
    # carga fica pausada; o primeiro ciclo seguinte é às 07h17.
    - cron: '17 10-23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-data:
    # Atualiza também após um push humano, para que correções de regra reflitam
    # imediatamente. O commit gerado pelo próprio robô não reinicia o ciclo.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar credencial Salesforce
        id: auth-state
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          if [ -n "$SF_AUTH_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "O segredo SF_AUTH_URL ainda não foi cadastrado."
          fi
      - name: Instalar Salesforce CLI
        if: steps.auth-state.outputs.configured == 'true'
        run: npm install --global @salesforce/cli@latest
      - name: Autenticar no Salesforce
        if: steps.auth-state.outputs.configured == 'true'
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          printf '%s' "$SF_AUTH_URL" > auth-url.txt
          sf org login sfdx-url --sfdx-url-file auth-url.txt --alias production --set-default
          rm auth-url.txt
      - name: Atualizar agregados do dashboard
        if: steps.auth-state.outputs.configured == 'true'
        # O painel histórico publicado começa em 2025. Manter o mesmo recorte
        # reduz a carga horária e evita consultas desnecessárias desde 2019.
        run: pwsh -File ./sync-salesforce.ps1 -TargetOrg production -StartYear 2025
      - name: Atualizar agregados do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            node ./sync-supabase-data.cjs
          else
            echo "O segredo SUPABASE_SERVICE_ROLE_KEY ainda não foi cadastrado; mantendo o snapshot atual."
          fi
      - name: Registrar snapshot atualizado
        run: |
          if git diff --quiet -- salesforce-data.js supabase-data.js; then
            echo "Sem alteracoes nos dados."
            exit 0
          fi
          git config user.name "Ideal Trends Dashboard"
          git config user.email "dashboard@idealtrends.com.br"
          git add salesforce-data.js supabase-data.js
          git commit -m "Atualiza snapshots comerciais"
          git push

  deploy:
    # Uma alteração de interface não deve esperar a sincronização completa do
    # Salesforce/Supabase. Se a carga gerar um novo snapshot, o push do bot
    # dispara uma nova publicação em seguida.
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-after-refresh:
    needs: refresh-data
    if: ${{ github.event_name != 'push' && needs.refresh-data.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
